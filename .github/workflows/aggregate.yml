name: 📦 Aggregate feed

# Rebuilds the consolidated alphyriver pkg feed: for every pkg ABI in
# plugins.yaml, downloads each plugin's released .pkg for that ABI, re-generates
# an RSA-signed pkg catalogue over them, and publishes one feed — one directory
# per ABI — to GitHub Pages. A package is stamped with the ABI of the host that
# built it and pkg rejects a mismatch, so the feed must carry every ABI in the
# fleet: OPNsense 26.1 and below are FreeBSD:14:amd64, 26.7+ are FreeBSD:15:amd64.
#
# This repo holds no plugin source — each plugin is built and released in its own
# canonical repo. See deploy/repo/README.md for the full design and one-time setup.
#
# Required repository setup (one-time):
#   - Secret  PKG_SIGNING_KEY : the RSA private key (PEM) whose public half is
#                               committed at deploy/repo/pkg-repo.pub.
#   - Secret  RELEASES_TOKEN  : (optional) PAT with contents:read on the source
#                               repos, if GITHUB_TOKEN can't read their releases.
#   - Pages   Settings → Pages → Source: "Deploy from a branch" → gh-pages / root.

on:
  push:
    branches: [ main ]
    paths:
      - 'plugins.yaml'
      - 'deploy/repo/**'
      - '.github/workflows/aggregate.yml'
  workflow_dispatch: {}

permissions:
  contents: write   # push the gh-pages feed branch

concurrency:
  group: aggregate-feed
  cancel-in-progress: false

jobs:
  aggregate:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Read manifest and download plugin packages
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # One feed directory per ABI, named by the real ABI (colons and all)
          # because that is what ${ABI} expands to in the client's repo conf.
          # A release asset name cannot carry colons, so each ABI also has a slug
          # that the manifest's asset glob substitutes for @SLUG@.
          yq -r '.abis[] | [.abi, .slug] | @tsv' plugins.yaml > abis.tsv
          if [ ! -s abis.tsv ]; then echo "::error::abis missing in plugins.yaml"; exit 1; fi

          while IFS=$(printf '\t') read -r abi slug; do
            if [ -z "$abi" ] || [ -z "$slug" ]; then echo "::error::malformed abis entry"; exit 1; fi
            echo "===> assembling $abi (slug $slug)"
            mkdir -p "site/${abi}"

            yq -r '.plugins[] | [.repo, .tag, .asset] | @tsv' plugins.yaml \
            | while IFS=$(printf '\t') read -r repo tag asset; do
                pattern=${asset//@SLUG@/$slug}
                echo "==> $repo @ $tag ($pattern)"
                # Every plugin must publish an asset for every ABI in the feed; a
                # missing one is a broken release, not something to skip past.
                gh release download "$tag" --repo "$repo" --pattern "$pattern" --dir "site/${abi}"
              done

            echo "downloaded packages for $abi:"; ls -l "site/${abi}"
            # At least one .pkg must have landed.
            ls "site/${abi}"/*.pkg >/dev/null
          done < abis.tsv

          # Package names for the landing page (strip the version/ABI tail off each
          # asset glob), and the list of ABIs the feed carries for its badge.
          PKG_LIST=$(yq -r '.plugins[].asset' plugins.yaml | sed 's/-\*-@SLUG@\.pkg$//' | paste -sd' ' -)
          ABI_LIST=$(yq -r '.abis[].abi' plugins.yaml | paste -sd',' - | sed 's/,/, /g')

          echo "PKG_LIST=$PKG_LIST" >> "$GITHUB_ENV"
          echo "ABI_LIST=$ABI_LIST" >> "$GITHUB_ENV"

      - name: Stage signing key
        env:
          SIGNING_KEY: ${{ secrets.PKG_SIGNING_KEY }}
        run: |
          if [ -z "$SIGNING_KEY" ]; then echo "::error::PKG_SIGNING_KEY secret is not set"; exit 1; fi
          umask 077
          printf '%s\n' "$SIGNING_KEY" > signing.key

      - name: Sign every ABI catalogue (FreeBSD)
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1  # v1.5.5
        with:
          usesh: true
          release: "15.1"
          prepare: |
            # The stock FreeBSD-kmods repo 404s for this ABI's quarterly branch and
            # can break pkg's bootstrap. We only run `pkg repo` (offline), so disable it.
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD-kmods: { enabled: no }' > /usr/local/etc/pkg/repos/FreeBSD-kmods.conf
          run: |
            set -e
            WS=$(pwd)
            # `pkg repo` indexes whatever packages sit in the directory; the ABI is
            # per-package metadata, so one host signs catalogues for every ABI.
            found=0
            for dir in "$WS"/site/FreeBSD:*; do
              [ -d "$dir" ] || continue
              echo "==> signing catalogue for $(basename "$dir")"
              pkg repo "$dir" "rsa:$WS/signing.key"
              echo "catalogue contents:"; ls -l "$dir"
              found=$((found + 1))
            done
            [ "$found" -gt 0 ] || { echo "::error::no ABI directories to sign"; exit 1; }

      - name: Render feed metadata (conf, key, landing page)
        run: |
          set -euo pipefail
          rm -f signing.key
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          PAGES_URL="https://${OWNER}.github.io/${REPO}"
          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          SRC="deploy/repo"

          # Repo conf + published copy of the signing public key.
          sed "s#@PAGES_URL@#${PAGES_URL}#g" "${SRC}/plugins.conf.in" > site/plugins.conf
          cp "${SRC}/pkg-repo.pub" site/pkg-repo.pub
          KEY_SHA256=$(sha256sum site/pkg-repo.pub | cut -d' ' -f1)

          # Landing page.
          sed -e "s#@PAGES_URL@#${PAGES_URL}#g" \
              -e "s#@REPO_URL@#${REPO_URL}#g" \
              -e "s#@REPO_SLUG@#${GITHUB_REPOSITORY}#g" \
              -e "s#@ABI@#${ABI_LIST}#g" \
              -e "s#@PKG_LIST@#${PKG_LIST}#g" \
              -e "s#@KEY_SHA256@#${KEY_SHA256}#g" \
              "${SRC}/index.html.in" > site/index.html
          echo "feed contents:"; ls -R site | head -40

      - name: Publish feed to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453  # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          keep_files: false
          commit_message: "feed: rebuild (${{ github.sha }})"
